[package]
name = "redfolder"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["0xbarss"]
description = "Async economic calendar client and automated trading blackout engine for algorithmic traders and prop firms"
license = "MIT"
repository = "https://github.com/0xbarss/redfolder"
readme = "README.md"
keywords = ["trading", "forex", "economic-calendar", "blackout", "prop-firm"]
categories = ["finance", "asynchronous", "command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:colored"]

[dependencies]
# Async runtime & channels
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Observability
tracing = "0.1"

# Async traits
async-trait = "0.1"

# CLI dependencies (optional)
clap = { version = "4.5", features = ["derive"], optional = true }
colored = { version = "2.1", optional = true }
tokio-util = "0.7.19"
chrono-tz = { version = "0.10.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"

[[bin]]
name = "redfolder"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bench]]
name = "blackout_benchmark"
harness = false

